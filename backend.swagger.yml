swagger: '2.0'
info:
  version: 1.0.0
  description: Provides CRUD API for AxxonData entities
  title: AxxonData Backend
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

host: "localhost:8080"
basePath: "/api/v1/ad-backend"

produces:
  - "application/json"
consumes:
  - "application/json"

paths:
  /:
    get:
      summary: Get Version Info
      description: Get Version Info
      operationId: getVersionInfo
      tags:
        - Common
      responses:
        200:
          $ref: "#/responses/versionInfo"
  /openapi-spec:
    get:
      summary: returns json api description
      description: getAPI
      tags:
        - Common
      operationId: getOpenAPISpec
      responses:
        200:
          description: scheme in json
          schema:
            type: object
        404:
          description: not found error
  /heartbeat:
    get:
      summary: Healthcheck
      description: Healthcheck
      tags:
        - Common
      operationId: healthcheck
      responses:
        200:
          description: service is ok
  /metrics:
    get:
      summary: Get metrics
      description: Returns metrics for backend
      tags:
        - Common
      produces:
        - "text/plain"
      consumes:
        - "application/json"
      responses:
        200:
          description: response with metrics values
          schema:
            type: object
        500:
          description: "Internal error during request processing"
          schema:
            type: object
            $ref: "#/definitions/error"
